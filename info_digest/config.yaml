name: Info Digest
version: "0.1.1"
slug: info_digest
description: Сводки городских чатов для Алисы
url: https://github.com/sergio3101/ha-info-digest
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:newspaper-variant-outline
panel_title: Сводки
options:
  telegram_chats:
    - chatsudaka
  retention_days: 30
  initial_backfill_hours: 24
  log_level: info
schema:
  telegram_api_id: "int?"
  telegram_api_hash: "password?"
  telegram_phone: "str?"
  telegram_chats:
    - "str"
  telegram_proxy: "str?"
  retention_days: "int(1,365)"
  initial_backfill_hours: "int(0,168)"
  log_level: "list(debug|info|warning|error)"
