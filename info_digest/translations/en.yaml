configuration:
  telegram_api_id:
    name: Telegram api_id
    description: Number from my.telegram.org → API development tools (collector account).
  telegram_api_hash:
    name: Telegram api_hash
    description: String from my.telegram.org → API development tools. Stored only in the add-on options.
  telegram_phone:
    name: Collector account phone
    description: International format, e.g. +79001234567.
  telegram_chats:
    name: Telegram groups
    description: Group usernames without @ or t.me links. The collector account must already be a member.
  telegram_proxy:
    name: Telegram proxy
    description: Optional, e.g. socks5://192.168.88.1:1080. Empty means direct connection.
  retention_days:
    name: Keep messages, days
    description: Messages older than this are deleted once a day.
  initial_backfill_hours:
    name: Initial backfill, hours
    description: How many hours of history to load when a group is first connected.
  yandex_folder_id:
    name: Yandex AI Studio folder ID
    description: Shown in the AI Studio page address after folders/, e.g. b1g...
  yandex_api_key:
    name: Yandex AI Studio API key
    description: Service account key from AI Studio → Access → API keys. Stored only in the add-on options.
  yandex_model:
    name: Yandex model
    description: Defaults to aliceai-llm-flash.
  llm_mode:
    name: What to send to the model
    description: candidates — only messages with category keywords (cheaper, recommended); all — everything except obvious noise.
  llm_monthly_token_limit:
    name: Monthly token limit
    description: Per model. When reached, the next model or rules-only labeling is used. 0 means no limit.
  event_window_hours:
    name: Event window, hours
    description: Messages of the same category and place within this window are grouped into one event.
  log_level:
    name: Log level
